packages:
  - packages/*

# esbuild arrives transitively through vitest and links a platform binary from a
# postinstall script. Approving it here keeps a fresh clone's first install silent
# instead of stopping to ask. It is a devDependency and never reaches a published
# bundle; nothing in this repo invokes it directly.
allowBuilds:
  # The opt-in real Codex acceptance composes this Harness service. Its native
  # process-tree owner is required to prove the provider leaves no child behind.
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true

# Quarantine a newly published version for two hours before this repo will
# install it, so a version pulled straight from the registry is never the first
# thing a build runs. The unit is minutes; raise it to widen the window.
#
# Two rather than a day because of how dshline takes its dependencies: the
# `dsh-*` line is pinned to one exact adopted generation (see HARNESS_TARGET),
# so a fresh upstream publish does not enter the graph on its own — adoption is
# a deliberate commit. The window is a brake on what an adoption installs, not
# the thing deciding when adoption may happen, and a day-long one only delayed
# same-day Harness adoptions this project does on purpose. Global and
# exception-free: no per-scope exclusion, and no CI override.
#
# The same number governs a consumer's first run, where it is not a repository
# setting at all: `packages/dshline/bin/dshline.mjs` passes it to the harness's
# pnpm on the command line, because the profile pnpm installs into belongs to
# the harness and carries no dshline policy of its own. Both places must say
# two hours, and `packages/dshline/tests/launcher-policy.spec.ts` fails if they
# drift apart.
minimumReleaseAge: 120

# Fail when a package's trust evidence gets WEAKER than the version before it —
# a package that was published by a trusted publisher and suddenly is not is the
# signature of a stolen maintainer account. Checked against every lockfile entry
# on every install, including a lockfile a contributor wrote, which is why CI
# never passes --trust-lockfile.
trustPolicy: no-downgrade

trustPolicyExclude:
  # `@types/node@22` pins `undici-types@~6.21.0`, which predates undici's move to
  # provenance; 7.16.0 and later carry attestations, but only `@types/node@24`
  # and later depend on that line, and this package's floor is Node 22 — typing
  # against a newer Node would let a call compile that the floor cannot run.
  # It is also a declaration-only devDependency: it ships no JavaScript, so it
  # cannot execute anything, and it never reaches a published tarball.
  - undici-types
