<!-- bottom statement -->
<rect x="18" y="942" width="1494" height="64" rx="8" fill="none" stroke="#47525a" stroke-width="1.5"/>
<text x="48" y="981" fill="#f4f7f8" font-family="monospace" font-size="21" font-weight="700">&gt;_</text>
<text x="92" y="981" fill="#f4f7f8" font-family="monospace" font-size="15" font-weight="600">dsh-tui doesn’t reimplement plugins or providers.</text>
<text x="584" y="981" fill="#28d8d2" font-family="monospace" font-size="14">It reads standard capability surfaces and presents them natively in your terminal.</text>
