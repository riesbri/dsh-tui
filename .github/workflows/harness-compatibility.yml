name: harness compatibility

# The harness is in developer preview and publishes frequently, so both probes
# run DAILY: one against upstream's unpublished default branch, one against the
# line users can actually install right now. The 24-hour minimumReleaseAge
# brake in pnpm-workspace.yaml still applies to everything here, which is the
# deliberate trade: a brand-new release waits its day before any job executes
# it, costing at most a day of detection delay.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# This workflow executes harness source (the master probe builds it) and
# freshly published packages (the released job installs and boots them), so it
# stays read-only at the top level; the single job that writes is the one that
# never runs dependency code, and it says so below.
permissions:
  contents: read

concurrency:
  group: harness-compatibility
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck against harness default branch
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repository and the public harness source

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Do not carry a cache across runs that build code from an unpinned
          # external branch. The ordinary CI workflow retains its safe cache.
          package-manager-cache: false

      # The upstream repository currently calls its default branch `master`, not
      # `main`. This intentionally follows that movable branch: detecting the
      # next incompatible harness commit is this workflow's purpose.
      - name: check out the latest harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: .harness
          persist-credentials: false

      # Build only inside the separate checkout. `--ignore-scripts` avoids
      # lifecycle code; the explicit build below is the one reviewed operation
      # needed to emit the declarations that link-harness.mjs validates.
      - name: install and build harness declarations
        working-directory: .harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      # This rewrites package links and the lockfile only in the disposable
      # runner. It lets TypeScript resolve the declarations just built above,
      # rather than the registry's pinned versions.
      - name: link the built harness declarations
        run: |
          node tools/link-harness.mjs .harness
          pnpm install --no-frozen-lockfile --ignore-scripts
          node tools/link-harness.mjs --check

      - run: pnpm run typecheck

  released:
    name: full suite against published harness
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Every @deepseek-ai/* spec is rewritten below, so a cached store keyed
          # on the committed lockfile would hide exactly the movement this job
          # exists to see.
          package-manager-cache: false

      # tools/sync-harness.mjs pins EVERY @deepseek-ai/* devDependency in BOTH
      # manifests — the bundle's and the workspace root's — to the exact
      # authoritative published version. That is what makes this a whole-graph
      # test rather than a mixed one: nothing Harness-side can stay behind on an
      # older line while the rest moves. The peer ranges themselves are never
      # written by the sync; their truth is measured next.
      - name: pin every harness package to the currently published version
        run: node tools/sync-harness.mjs

      # The peer contract is RECORDED here, not enforced yet. A newly published
      # prerelease tuple is EXPECTED to sit outside the declared ranges until a
      # human widens them, and exactly that state is the interesting case to
      # test fully: does the rejected line nonetheless install, build,
      # typecheck, pass the suite, and boot? Every runtime step below therefore
      # runs regardless of this verdict, and the final step turns the job red
      # if either axis failed. Exit code 2+ means the checker itself broke,
      # which is neither acceptance nor rejection and must be loud on its own.
      - id: peers
        run: |
          set +e
          node tools/check-peer-currency.mjs | tee peer-report.txt
          RC=${PIPESTATUS[0]}
          set -e
          case "$RC" in
            0) echo "verdict=ACCEPTED" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=REJECTED" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=UNKNOWN" >> "$GITHUB_OUTPUT" ;;
          esac
          exit 0

      # Runner-local resolution of the rewritten manifests; disposable, like
      # every other mutation in this workflow. continue-on-error lets the rest
      # of the suite answer independently of any single failure.
      - id: install
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - id: build
        continue-on-error: true
        run: pnpm run build

      - id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - id: test
        continue-on-error: true
        run: pnpm run test

      # The consumer path: packed bundle, published launcher, fresh profile, a
      # real pseudo-terminal, startup banner, clean ctrl-d. Types passing is not
      # a boot; this is the check that would have caught nothing in the audit —
      # and the one whose absence let a lying range sit unnoticed for days.
      - id: smoke
        continue-on-error: true
        name: boot the packed plugin beside the published launcher
        run: node tools/consumer-smoke.mjs

      # The only place this job decides color: runtime compatibility (install,
      # build, typecheck, suite, smoke) reported separately from the peer
      # contract, so a REJECTED line with green runtime reads as "works,
      # awaiting an explicit range decision" instead of an unexplained red.
      - name: compatibility verdict
        if: always()
        env:
          PEER_VERDICT: ${{ steps.peers.outputs.verdict }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          RUNTIME="PASS"
          for OUTCOME in "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$SMOKE_OUTCOME"; do
            if [ "$OUTCOME" != "success" ]; then RUNTIME="FAIL"; fi
          done
          {
            echo "runtime compatibility: $RUNTIME"
            echo "peer contract: $PEER_VERDICT"
          } | tee verdict.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$PEER_VERDICT" != "ACCEPTED" ] && [ -f peer-report.txt ]; then
            {
              echo
              echo '<details><summary>peer-currency report</summary>'
              echo
              echo '```'
              cat peer-report.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RUNTIME" != "PASS" ] || [ "$PEER_VERDICT" != "ACCEPTED" ]; then
            exit 1
          fi

  open-update-pr:
    # Maintains ONE rolling automated sync pull request against a fixed branch
    # (automation/harness-sync): created when the published line first moves,
    # updated with fresh pins whenever it moves again while still open.
    # This job deliberately runs NO dependency code: no build, no test, no boot.
    # Its only operations are manifest rewrites by our own tool, a
    # `--lockfile-only` install (resolution without linking or lifecycle
    # scripts), and git/gh plumbing — which is what makes holding a write token
    # here consistent with keeping every executing job read-only.
    name: harness sync pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync branch, when the token for it exists
      pull-requests: write # open the pull request itself

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The token itself is scoped to the single step that performs writes;
      # secrets cannot be read from `if:` expressions, so presence is probed
      # here into a boolean output and only the boolean ever travels.
      - id: token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - id: sync
        run: |
          node tools/sync-harness.mjs | tee sync-report.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the repository already tracks the published line"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: refresh the lockfile without executing anything
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --lockfile-only --ignore-scripts

      # Routine move (checker green): the new line fits inside the declared
      # ranges, so this is a version bump a reviewer rubber-stamps. Line move
      # the ranges reject: same branch, but named as the compatibility decision
      # it now requires, with the failing checker as its first evidence.
      # Exit code 2+ means the checker itself broke — that must surface as a
      # red job, never silently become either classification.
      - id: classify
        if: steps.sync.outputs.changed == 'true'
        run: |
          set +e
          node tools/check-peer-currency.mjs > /dev/null 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "routine" > kind.txt
            echo "chore: track published Harness line" > pr-title.txt
          elif [ "$RC" -eq 1 ]; then
            echo "compatibility" > kind.txt
            echo "chore(harness): published line moved — peer compatibility decision required" > pr-title.txt
          else
            exit "$RC"
          fi

      # One ROLLING branch, one open pull request at a time: the branch is
      # reset onto today's base and force-pushed, and an existing open PR for
      # that head is edited in place instead of duplicated. The concurrency
      # group makes this job its branch's single writer, which is why a plain
      # force push is safe here — there is no other history anyone could have
      # based work on.
      #
      # The write credential exists ONLY inside this step: checkout ran with
      # persist-credentials: false, so the force push would otherwise be
      # anonymous. `gh auth setup-git` wires git's credential helper for
      # github.com to gh, which authenticates from GH_TOKEN; the token is
      # never placed on a command line or in the repository config.
      - name: create or update the rolling sync pull request
        if: steps.sync.outputs.changed == 'true' && steps.token.outputs.present == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          BRANCH="automation/harness-sync"
          KIND="$(cat kind.txt)"
          {
            echo "## Automated Harness sync"
            echo
            echo '```'
            cat sync-report.txt
            echo '```'
            echo "Classification: **$KIND** — decided by \`pnpm run check-peers\` after pinning."
            echo
            echo "This pull request is a rolling target: it is rewritten whenever the"
            echo "published line moves, so review the latest state rather than the diff"
            echo "against a previous revision."
            if [ "$KIND" = "compatibility" ]; then
              echo
              echo "> [!WARNING]"
              echo "> The published line is REJECTED by the current peer ranges."
              echo "> Extending a range is an explicit compatibility decision:"
              echo "> verify the new line at all three levels, then widen deliberately."
              echo "> CI on this pull request is expected to be red until then."
            fi
          } > pr-body.md
          git config user.name "dshline sync bot"
          git config user.email "noreply@riesbri.dev"
          gh auth setup-git
          git checkout -B "$BRANCH"
          git commit -am "$(cat pr-title.txt)"
          git push --force origin "$BRANCH"
          NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq 'if length > 0 then .[0].number else empty end')"
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" \
              --title "$(cat pr-title.txt)" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$(cat pr-title.txt)" --body-file pr-body.md
          fi

      - name: explain the missing token instead of failing silently
        if: steps.sync.outputs.changed == 'true' && steps.token.outputs.present == 'false'
        run: |
          echo "The published line moved, but no SYNC_TOKEN secret is configured,"
          echo "so no pull request could be opened (a GITHUB_TOKEN-created PR would"
          echo "not run CI anyway). Configure SYNC_TOKEN — a fine-grained PAT with"
          echo "Contents: write and Pull requests: write, mirroring VERSION_TOKEN —"
          echo "or run \`node tools/sync-harness.mjs\` locally and open it by hand."
          echo
          echo "The released job above still tested this line today regardless."
