name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The bundle's devDependencies link the harness from a sibling checkout,
      # which CI does not have. pnpm warns about the missing directories and
      # continues; nothing under test imports the harness at runtime, because
      # every harness import in a tested module is type-only.
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      # The renderer is self-contained, so its declarations and JavaScript build
      # here. The bundle's typecheck needs the harness and runs locally instead.
      - run: pnpm exec tsc -b packages/renderer

      - run: pnpm exec vitest run

  # Building the whole harness takes minutes, so this runs on demand rather than
  # on every push: a slow job that can fail for reasons outside this repo is
  # worse than no job. Run it before a release, or when a harness upgrade lands.
  typecheck:
    name: typecheck against the harness
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: dsh-tui

      # The bundle typechecks against the harness's real service types, so the
      # sibling checkout the devDependencies expect has to exist. Only its
      # declarations are needed, so the harness is cloned shallow and built with
      # its own toolchain.
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: build the harness
        working-directory: deepseek-harness
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run build

      - name: typecheck the bundle
        working-directory: dsh-tui
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm exec tsc -b
