name: ci

# dshline tracks DeepSeek Harness aggressively and supports it narrowly: ONE
# adopted Harness architecture at a time, kept close to upstream master, with
# obsolete assumptions deleted rather than carried behind a compatibility
# layer. This file is that policy expressed as four separable questions:
#
#   Core              is dshline itself correct?                      BLOCKING
#   Harness target    does it work against the exact upstream source
#                     revision it claims to support (HARNESS_TARGET)?  BLOCKING
#   Harness upstream  does it still work against today's master?      INFORMATIONAL
#   Harness published can a real user install and boot it?            BLOCKING once npm carries the target
#
# The distinction that matters: `master` is a branch DeepSeek controls and can
# move five minutes before an unrelated dshline pull request is merged, so it
# is watched continuously and gates nothing. The adopted target is an exact
# commit this repository chose, so it is reproducible and gates everything.
#
# Which event runs which job — see the per-job `if:` below:
#
#   pull_request / push(main) : core, windows-launcher, docs, harness-target, harness-published
#   schedule (daily)          : harness-upstream, harness-published
#   workflow_dispatch         : all six
#
# Nothing here reads an npm dist-tag. A dist-tag is a moving pointer whose name
# (`next`, `alpha`, `rc`, …) is an upstream distribution detail, and CI keyed on
# one needs redesigning every time upstream changes channels. The target is an
# exact commit and an exact version; the published lane asks only whether that
# exact version exists on the registry yet.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # One daily run answers "did upstream move, and has npm caught up".
    - cron: '17 6 * * *'
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref and event kind.
# Keyed on event name too, so a nightly schedule run is never cancelled by an
# unrelated push to main that happens to land at the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commits rather than tags: a tag is a mutable pointer its
# owner can move, so `@v4` is a standing grant to run whatever they publish next,
# and this repository saw `pnpm/action-setup@v4` change commits between two
# consecutive runs. `.github/workflows/security.yml` checks that this holds.
jobs:
  core:
    name: Core · Node ${{ matrix.node }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 rather than the newest Node 22 patch: engines declares the
        # floor as `^22.19`, and testing the newest 22.x would let code that
        # only works from 22.20 onward pass silently. 24 and 26 track their
        # latest patch, because nothing here promises a floor inside those
        # majors the way `^22.19` names one inside 22.
        node: ['22.19', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job's token is left in .git/config, where anything later
          # in the job — including a dependency's build script — can read it, and
          # an uploaded artifact can carry it out of the run.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Every dsh-* dependency in both manifests is pinned to HARNESS_TARGET's
      # version, so this ordinary install builds and tests against the adopted
      # Harness generation — the same one `Harness target` checks out from
      # source — rather than whatever a floating range happened to resolve to.
      # `tools/harness-target.spec.mjs` is what enforces that, and it runs as
      # part of the suite below.
      # --ignore-scripts: an install script is arbitrary code from a dependency,
      # and nothing here needs one to build or test. The lockfile is verified, not
      # trusted — see the supply-chain policies in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run test

  windows-launcher:
    # Focused on purpose: the whole suite already runs on Linux, and what only
    # Windows can answer is the launcher hand-off. What npm installs there is a
    # `dsh.cmd` batch shim — `spawn` refuses to run one directly since the
    # CVE-2024-27980 hardening, and a bare `dsh` names no file — so the wrapper
    # goes through `cmd.exe`, and a quoting layer is worth only as much as the
    # argv a shim actually received. These two specs record that argv.
    name: Windows launcher · npm .cmd shim
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: launcher resolution and the .cmd shim hand-off
        run: pnpm exec vitest run packages/dshline/tests/launcher-policy.spec.ts packages/dshline/tests/launcher-bootstrap.spec.ts

  docs:
    name: Docs · EN/ZH pairing
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Compares each side's recorded blob hash and their Markdown structure.
      # Needs no dependencies, so it runs standalone rather than after an
      # install the check itself never touches.
      - run: node tools/verify-translation-pairing.mjs

  harness-target:
    # The architecture dshline claims to support, checked out from source at
    # the exact commit `HARNESS_TARGET` names. Blocking, and deterministic
    # because the revision is a full commit sha a human wrote down — not a
    # branch, not a dist-tag, nothing that can move between two runs of the
    # same commit of this repository.
    #
    # This replaces the previous Minimum/Released pair. Both existed to
    # maintain several published Harness lines at once, and by the end they
    # were pinning the same version by two different mechanisms — a fixed
    # floor and a `next` dist-tag that had caught up to it.
    name: Harness target · adopted source revision
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repository and the public harness source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # This job installs a second, foreign package graph (the harness
          # checkout's own). Keep its store out of the ordinary lanes' cache.
          package-manager-cache: false

      # HARNESS_TARGET is the only place the adopted revision is written down;
      # reading it here rather than repeating it in this file is what keeps a
      # migration to one commit instead of two files that can disagree.
      - name: read the adopted harness target
        id: target
        run: |
          {
            echo "revision=$(node tools/harness-target.mjs --revision)"
            echo "version=$(node tools/harness-target.mjs --version)"
          } >> "$GITHUB_OUTPUT"

      - name: check out the adopted harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.target.outputs.revision }}
          path: .harness
          persist-credentials: false

      # Build only inside the separate checkout. --ignore-scripts avoids
      # lifecycle code; the explicit build below is the one reviewed operation
      # needed to emit the declarations link-harness.mjs validates.
      - name: install and build the harness declarations
        working-directory: .harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      # Rewrites package links and the lockfile only in the disposable runner,
      # exactly the way tools/link-harness.mjs links a local checkout for
      # manual development. TypeScript — and vitest's runtime module resolution
      # below — then resolve the declarations just built rather than the
      # registry's published tarballs.
      - name: link the built harness declarations
        run: |
          node tools/link-harness.mjs .harness
          pnpm install --no-frozen-lockfile --ignore-scripts
          node tools/link-harness.mjs --check

      - id: typecheck
        continue-on-error: true
        run: |
          pnpm run typecheck 2>&1 | tee typecheck.txt
          exit "${PIPESTATUS[0]}"

      # Focused rather than a second full suite: Core already established
      # dshline's own correctness on every supported Node against this same
      # generation's published packages. What only source-linking can answer is
      # whether the Harness-facing seams still hold, and capability-report
      # names which one broke instead of producing a wall of tsc diagnostics.
      # It runs through vitest's transpile-only execution, so a type-only
      # upstream change can leave it green and still fail the typecheck above —
      # two independent signals on purpose.
      - id: capability
        continue-on-error: true
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: node tools/capability-report.mjs "target ($TARGET_VERSION)" | tee capability.txt

      - name: target verdict
        if: always()
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
        run: |
          {
            echo "Adopted Harness target: $TARGET_VERSION @ ${REVISION:0:8}"
            echo "source typecheck: $([ "$TYPECHECK_OUTCOME" = success ] && echo PASS || echo FAIL)"
            echo
            cat capability.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            {
              echo '<details><summary>typecheck output</summary>'
              echo
              echo '```'
              cat typecheck.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Blocking: this is the architecture dshline says it supports. If it
          # is red, either the claim in HARNESS_TARGET is wrong or the change
          # under review broke it.
          if [ "$TYPECHECK_OUTCOME" != "success" ] || [ "$CAPABILITY_OUTCOME" != "success" ]; then
            exit 1
          fi

  harness-upstream:
    name: Harness upstream · master (informational)
    # Never on pull_request or push. This probes a moving branch DeepSeek
    # controls: a commit pushed five minutes ago must not make an unrelated
    # dshline pull request unmergeable. Red here is a signal to migrate, on
    # purpose and on our schedule — never a merge gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out this repository and the public harness source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Do not carry a cache across runs that build code from an unpinned
          # external branch. The ordinary jobs above keep their safe cache.
          package-manager-cache: false

      - name: read the adopted harness target
        id: target
        run: |
          {
            echo "revision=$(node tools/harness-target.mjs --revision)"
            echo "version=$(node tools/harness-target.mjs --version)"
          } >> "$GITHUB_OUTPUT"

      # The upstream repository currently calls its default branch `master`, not
      # `main`. This intentionally follows that movable branch: seeing the next
      # incompatible harness commit before it is adopted is the whole job.
      - name: check out the latest harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: .harness
          persist-credentials: false

      # The exact commit under test, recorded so a red run names a revision a
      # human can read, diff against the adopted target, and migrate onto.
      - name: record the exact commit under test
        id: harness-sha
        working-directory: .harness
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: install and build harness declarations
        working-directory: .harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: link the built harness declarations
        run: |
          node tools/link-harness.mjs .harness
          pnpm install --no-frozen-lockfile --ignore-scripts
          node tools/link-harness.mjs --check

      - id: typecheck
        continue-on-error: true
        run: |
          pnpm run typecheck 2>&1 | tee typecheck.txt
          exit "${PIPESTATUS[0]}"

      - id: capability
        continue-on-error: true
        env:
          HARNESS_SHA: ${{ steps.harness-sha.outputs.sha }}
        run: node tools/capability-report.mjs "upstream master @ $HARNESS_SHA" | tee capability.txt

      - name: upstream verdict
        if: always()
        env:
          REVISION: ${{ steps.target.outputs.revision }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          HARNESS_SHA: ${{ steps.harness-sha.outputs.sha }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
        run: |
          {
            echo "Upstream master: $HARNESS_SHA"
            echo "Adopted target:  $REVISION ($TARGET_VERSION)"
            if [ "$HARNESS_SHA" = "$REVISION" ]; then
              echo 'upstream has not moved past the adopted target'
            else
              echo 'upstream has moved past the adopted target — inspect the change and decide whether to migrate'
              echo "  https://github.com/deepseek-ai/deepseek-harness/compare/${REVISION}...${HARNESS_SHA}"
            fi
            echo
            echo "source typecheck: $([ "$TYPECHECK_OUTCOME" = success ] && echo PASS || echo FAIL)"
            echo
            cat capability.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" != "success" ]; then
            {
              echo '<details><summary>typecheck output</summary>'
              echo
              echo '```'
              cat typecheck.txt
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # This job never runs on pull_request or push, so a non-zero exit
          # cannot gate a merge. It still exits non-zero on a real
          # incompatibility: informational means non-blocking, not dishonest,
          # and a lane that always reported green would be worth nothing.
          if [ "$TYPECHECK_OUTCOME" != "success" ] || [ "$CAPABILITY_OUTCOME" != "success" ]; then
            exit 1
          fi

  harness-published:
    # The question npm answers and source cannot: can a normal user install
    # this, and does it boot? Packed bundle, the real published launcher at the
    # adopted version, a fresh profile, a real pseudo-terminal.
    #
    # Publication lag is reported as itself. GitHub source moves first and npm
    # catches up later; "the generation we target is not on the registry yet"
    # is a release-readiness fact, not evidence that dshline is broken against
    # the architecture it targets — and it must never be the reason someone
    # writes compatibility code for an older published line.
    name: Harness published · consumer install path
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: read the adopted harness target
        id: target
        run: echo "version=$(node tools/harness-target.mjs --version)" >> "$GITHUB_OUTPUT"

      # An exact version lookup, never a dist-tag: which channel upstream
      # publishes a generation under is a distribution detail that changes
      # without the architecture changing.
      - name: has npm published the adopted generation yet
        id: published
        run: node tools/harness-target.mjs --published | tee -a "$GITHUB_OUTPUT"

      - if: steps.published.outputs.published == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - if: steps.published.outputs.published == 'true'
        run: pnpm run build

      # The consumer path: packed bundle, published launcher pinned to the
      # adopted version, fresh profile, a real pseudo-terminal, startup banner,
      # clean ctrl-d. Types resolving is not a boot.
      - name: boot the packed plugin beside the published launcher
        if: steps.published.outputs.published == 'true'
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: node tools/consumer-smoke.mjs --launcher-version "$TARGET_VERSION"

      # The other advertised sequence, and the one a new user actually types:
      # `npm install -g` then `dshline`, against an empty harness home. Nothing
      # pre-creates the profile — the harness initializes and installs it from
      # inside the wrapper's first run, while a real terminal answers the
      # question — and the session it continues into has to reach `ready`.
      - name: first run from nothing, beside the published launcher
        if: steps.published.outputs.published == 'true'
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: node tools/consumer-smoke.mjs --bootstrap --launcher-version "$TARGET_VERSION"

      - name: consumer verdict
        if: always()
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          PUBLISHED: ${{ steps.published.outputs.published }}
        run: |
          {
            if [ "$PUBLISHED" = "true" ]; then
              echo "Consumer path validated against @deepseek-ai/dsh@$TARGET_VERSION"
            else
              echo "@deepseek-ai/dsh@$TARGET_VERSION is not on npm yet — consumer path NOT validated this run."
              echo 'This is publication lag, not an incompatibility: dshline targets an upstream'
              echo 'source revision, and the registry catches up afterwards. It is never a reason'
              echo 'to support an older published generation.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
